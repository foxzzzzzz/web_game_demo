# Ubuntu 单机部署的默认配置。deploy.sh 首次运行时会基于这些默认值交互生成私有配置文件。
# 该文件不包含域名、仓库地址等环境专属信息；生成后的配置文件权限为 600。

# Node.js 主版本；20 为当前受支持的 LTS 主线。
NODE_MAJOR=20

# 使用 Corepack 激活的 pnpm 版本。
PNPM_VERSION=10

# 未输入时使用的部署应用名；会用于 Nginx 站点名和 /etc 下的配置文件名。
APP_NAME=reborn-snake

# 未输入时使用的静态文件发布根目录。每次发布会新建一个带时间戳的版本目录。
DEPLOY_ROOT=/var/www/reborn-snake

# 未输入时使用的 Nginx HTTP 监听端口。
HTTP_PORT=80

# 是否停用 Ubuntu 自带的 default Nginx 站点；只有需要通过服务器 IP 且使用 80 端口时才需要。
DISABLE_DEFAULT_NGINX_SITE=true

# 静态资源的浏览器缓存时长。
ASSET_CACHE_DURATION=365d
